
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .card-header-custom {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border: none;
        }

        .card-header-custom h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-body {
            padding: 35px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.15);
        }

        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login:hover {
            color: white;
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .welcome-message {
            border-radius: 12px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="card login-card">

    <div class="card-header card-header-custom">
        <h2>Welcome Back!</h2>
        <p class="mb-0">Please enter your details below</p>
    </div>

    <div class="card-body">

        <form th:action="@{/login}" method="get">

            <div class="mb-4">
                <label for="name" class="form-label fw-semibold">
                    Full Name
                </label>
                <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        th:value="${param.name}"
                        required>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label fw-semibold">
                    Email Address
                </label>
                <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        th:value="${param.email}"
                        required>
            </div>

            <button type="submit" class="btn btn-login w-100">
                Submit &rarr;
            </button>

        </form>

        <!-- Show only after successful form submission -->
        <div class="alert alert-success welcome-message mt-4 mb-0"
             role="status"
             th:if="${str != null}"
             th:text="${str}">
        </div>

    </div>

    <div class="card-footer bg-light text-center py-3">
        <small class="text-muted">Powered by Spring Boot &amp; Thymeleaf</small>
    </div>

</div>

</body>
</html>
